# Frozen Image-Edit pilot A; original Qwen + 3000 train / 200 validation.
# Test data is never passed to Trainer. Pilot adapters are not reused.
# Two complete passes: 188 updates/pass, including one 8-sample tail batch.
# Explicit 376 steps avoids Transformers 4.51.3 epoch-step floor rounding.
model_name_or_path: /mnt/sdc/zhc/IEA/models/Qwen2.5-VL-7B-Instruct
trust_remote_code: false
quantization_bit: 4
quantization_method: bnb
quantization_type: nf4
double_quantization: true
image_max_pixels: 262144
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_target: q_proj,v_proj
lora_dropout: 0.0
freeze_vision_tower: true
freeze_multi_modal_projector: true
flash_attn: sdpa
dataset: iea_edit_3k_train
dataset_dir: /mnt/sdc/zhc/IEA/data
template: qwen2_vl
cutoff_len: 2048
preprocessing_num_workers: 2
dataloader_num_workers: 2
output_dir: /mnt/sdc/zhc/IEA/outputs/stage1-A-image-edit-3k-v1
report_to: none
logging_steps: 5
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
max_steps: 376
learning_rate: 0.0001
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
upcast_layernorm: true
optim: adamw_torch
save_strategy: steps
eval_strategy: steps
seed: 20261031
data_seed: 20261031
remove_unused_columns: false
overwrite_output_dir: false
disable_tqdm: false
eval_dataset: iea_edit_3k_validation
do_eval: true
per_device_eval_batch_size: 2
prediction_loss_only: true
max_grad_norm: 1.0
logging_first_step: true
eval_steps: 94
save_steps: 94
save_total_limit: 2
save_only_model: false
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
dataloader_drop_last: false
